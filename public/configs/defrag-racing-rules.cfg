// defrag.racing - rules config
//
// The cvars below are the DFWC 2021 ruleset, unchanged. Only this header is
// ours. Original: https://dfwc.q3df.org/comp/dfwc2021/rules.html
//
// WHY YOU WANT IT
// Offline, Quake starts with pmove_fixed 0, and a run made that way is not
// accepted. This config sets pmove_fixed 1, the same value the defrag.racing
// servers run, so an offline run has the same physics as an online one.
//
// HOW TO USE IT
// Put the file in your  <quake3>/defrag/  folder, start the game, and type:
//   /exec defrag-racing-rules.cfg
// It does not replace your own config. It sets these cvars on top of it.
//
// Online you do not need this. The server sets pmove_fixed, pmove_msec and
// g_synchronousClients itself, and your own values are ignored.
//
// Quake 3 DeFRaG World cup 2021
// OFFICIAL PAGE - dfwc.q3df.org
// If you have any problems with this site, please ask in discord defrag server, in the channel #dfwc

// Good luck and have fun!

// Allowed Defrag version
// Quake 3 DeFRag 1.91.27 (https://q3defrag.org/files/defrag/defrag_1.91.27.zip)

seta timescale               "1"
seta pmove_fixed             "1"
seta pmove_msec              "8"
seta sv_fps                  "125"
seta com_maxfps              "125"
seta g_speed                 "320"
seta g_gravity               "800"
seta g_knockback             "1000"
seta sv_cheats               "0"
seta handicap                "100"

// Demo settings
seta df_autorecord           "1"
// must be set to a value between "1000" and "10000"
seta df_ar_stopdelay         "2000"
seta df_ar_format            "$map.$-route[$gt.$phys.$-mode]$m.$-s.$-ms($pl.$plc)"

// addon
seta df_mp_interferenceoff   "3"
seta g_killWallbug           "1"

echo
echo
echo "^1DFWC-2021 rules.cfg loaded ^2:)"
echo
